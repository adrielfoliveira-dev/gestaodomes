<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Mês</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6C5CE7">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F3FF;--surface:#fff;--ink:#1E1B3A;--mute:#6B6890;--line:#E6E2FA;--p:#6C5CE7;--g:#14C38E;--r:#FF4D6D;--y:#FFB020;--hero:linear-gradient(135deg,#6C5CE7,#A855F7 55%,#FF4D8D);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122B;--surface:#1F1C40;--ink:#F3F1FF;--mute:#A29FCB;--line:#332F5E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14122B;--surface:#1F1C40;--ink:#F3F1FF;--mute:#A29FCB;--line:#332F5E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 'DM Sans',system-ui,sans-serif;min-height:100vh;padding-bottom:84px}
h1,h2,h3,.big{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top h1{font-size:22px;font-weight:800}
.mn{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:99px;padding:4px;border:1px solid var(--line)}
.mn button{border:0;background:none;color:var(--ink);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer}
.mn span{min-width:110px;text-align:center;font-weight:700;font-size:14px;text-transform:capitalize}
.hero{background:var(--hero);color:#fff;border-radius:26px;padding:20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero small{opacity:.85}.hero .big{font-size:38px;font-weight:800;line-height:1.1;margin:2px 0 14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.row3 div{background:rgba(255,255,255,.18);border-radius:14px;padding:8px 10px}
.row3 b{display:block;font-size:14px}.row3 small{font-size:11px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:12px}
.card h2{font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.grow{flex:1;min-width:0}.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow small,.mute{color:var(--mute);font-size:12px}
.pos{color:var(--g);font-weight:700}.neg{color:var(--r);font-weight:700}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
.btn{border:0;border-radius:14px;padding:10px 16px;font:700 14px 'DM Sans',sans-serif;cursor:pointer;background:var(--p);color:#fff}
.btn.s{padding:6px 11px;font-size:12px;border-radius:10px}.btn.g{background:var(--g)}.btn.o{background:var(--line);color:var(--ink)}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px;padding:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav div{display:flex;width:100%;max-width:640px;gap:2px}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:6px 0;border-radius:14px;font:500 11px 'DM Sans',sans-serif;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--p);background:color-mix(in srgb,var(--p) 13%,transparent);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--hero);color:#fff;font-size:28px;box-shadow:0 8px 22px rgba(108,92,231,.5);cursor:pointer;z-index:19}
.sheet{position:fixed;inset:0;background:rgba(10,8,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet form,.sheet .box{background:var(--surface);width:100%;max-width:640px;border-radius:26px 26px 0 0;padding:20px;display:grid;gap:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet input,.sheet select{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:16px 'DM Sans',sans-serif}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:10px;border-radius:12px;border:1.5px solid var(--line);background:none;color:var(--ink);font-weight:700;cursor:pointer}
.seg button.on.out{background:var(--r);border-color:var(--r);color:#fff}.seg button.on.in{background:var(--g);border-color:var(--g);color:#fff}
.donut{display:flex;align-items:center;gap:16px}
.leg{flex:1;display:grid;gap:5px;font-size:13px}.leg div{display:flex;justify-content:space-between;gap:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.empty{text-align:center;color:var(--mute);padding:22px 8px}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:none;cursor:pointer;color:#fff;font-weight:800;flex:none}
.chk.on{background:var(--g);border-color:var(--g)}
.done{text-decoration:line-through;opacity:.55}
.goal{display:flex;gap:14px;align-items:center}
.tip{background:color-mix(in srgb,var(--y) 18%,transparent);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:10px}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Novo lançamento" onclick="addTx()">+</button>
<nav><div id="nav"></div></nav>
<script>
const CATS={Moradia:['🏠','#6C5CE7'],Alimentação:['🍕','#FF7A59'],Transporte:['🚌','#00B8D9'],Lazer:['🎮','#FF4D8D'],Saúde:['💊','#14C38E'],Educação:['📚','#FFB020'],Compras:['🛍️','#A855F7'],Outros:['✨','#8A94A6']};
const INC=['Salário','Extra','Investimentos'];
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Math.random().toString(36).slice(2,9);
let ym=new Date().toISOString().slice(0,7),tab='home',S;
const mk=(d)=>ym+'-'+String(d).padStart(2,'0');
function seed(){return{tx:[
{id:uid(),t:'in',d:'Salário',v:4800,c:'Salário',dt:mk(5)},
{id:uid(),t:'in',d:'Freela de design',v:650,c:'Extra',dt:mk(12)},
{id:uid(),t:'out',d:'Aluguel',v:1500,c:'Moradia',dt:mk(6)},
{id:uid(),t:'out',d:'Supermercado',v:480,c:'Alimentação',dt:mk(9)},
{id:uid(),t:'out',d:'Uber e ônibus',v:160,c:'Transporte',dt:mk(10)},
{id:uid(),t:'out',d:'Cinema e pizza',v:120,c:'Lazer',dt:mk(14)},
{id:uid(),t:'out',d:'Farmácia',v:75,c:'Saúde',dt:mk(15)},
{id:uid(),t:'out',d:'Curso online',v:99,c:'Educação',dt:mk(16)}],
bud:{Moradia:1600,Alimentação:700,Transporte:300,Lazer:250,Saúde:200,Educação:150,Compras:300,Outros:150},
goals:[{id:uid(),n:'Reserva de emergência',e:'🛟',tg:10000,sv:2300},{id:uid(),n:'Viagem dos sonhos',e:'✈️',tg:5000,sv:1200},{id:uid(),n:'Notebook novo',e:'💻',tg:4000,sv:900}],
bills:[{id:uid(),n:'Internet',v:99,day:10,paid:{}},{id:uid(),n:'Energia',v:140,day:15,paid:{}},{id:uid(),n:'Streaming',v:45,day:20,paid:{}}],
tasks:[{id:uid(),n:'Revisar gastos da semana',ok:{}},{id:uid(),n:'Transferir para a reserva',ok:{}},{id:uid(),n:'Cancelar assinatura que não uso',ok:{}}]}}
function load(){try{S=JSON.parse(localStorage.getItem('meumes1'))}catch(e){}if(!S)S=seed()}
function save(){try{localStorage.setItem('meumes1',JSON.stringify(S))}catch(e){}}
load();
const mtx=()=>S.tx.filter(x=>x.dt.startsWith(ym)).sort((a,b)=>b.dt.localeCompare(a.dt));
function sums(){const t=mtx();const i=t.filter(x=>x.t==='in').reduce((a,x)=>a+x.v,0),o=t.filter(x=>x.t==='out').reduce((a,x)=>a+x.v,0);const by={};t.filter(x=>x.t==='out').forEach(x=>by[x.c]=(by[x.c]||0)+x.v);return{i,o,by,bal:i-o}}
function mlabel(){const[y,m]=ym.split('-');return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function shift(n){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function donut(by,tot){if(!tot)return'';let off=0;const R=48,C=2*Math.PI*R;const arcs=Object.entries(by).map(([k,v])=>{const l=v/tot*C;const s=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${CATS[k][1]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return s}).join('');return`<svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Gastos por categoria">${arcs}<text x="60" y="64" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">${Math.round(tot)}</text></svg>`}
function txRow(x,del){const c=x.t==='in'?['💰','#14C38E']:CATS[x.c]||CATS.Outros;return`<div class="item"><div class="ic" style="background:${c[1]}22">${c[0]}</div><div class="grow"><b>${esc(x.d)}</b><small>${x.c} · ${x.dt.split('-').reverse().slice(0,2).join('/')}</small></div><span class="${x.t==='in'?'pos':'neg'}">${x.t==='in'?'+':'−'}${brl(x.v)}</span>${del?`<button class="x" aria-label="Excluir" onclick="delTx('${x.id}')">✕</button>`:''}</div>`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function home(){const s=sums(),rate=s.i?Math.round((s.bal/s.i)*100):0;const days=new Date(ym.slice(0,4),ym.slice(5),0).getDate();
const ent=Object.entries(s.by).sort((a,b)=>b[1]-a[1]);
const top=ent[0];
const pend=S.bills.filter(b=>!b.paid[ym]);const due=pend.reduce((a,b)=>a+b.v,0);
const tip=!s.i?'Registre sua renda para ver a taxa de economia.':rate>=20?`Ótimo! Você guardou ${rate}% da renda. Que tal mandar uma parte para uma meta?`:rate>=0?`Você economizou ${rate}%. A meta clássica é 20%${top?` — ${top[0]} é seu maior gasto`:''}.`:'Gastos acima da renda neste mês. Revise o orçamento por categoria.';
return`<section class="hero"><small>Saldo do mês</small><div class="big">${brl(s.bal)}</div><div class="row3"><div><small>Entrou</small><b>${brl(s.i)}</b></div><div><small>Saiu</small><b>${brl(s.o)}</b></div><div><small>Economia</small><b>${rate}%</b></div></div></section>
<div class="tip">💡 ${tip}</div>
<div class="card"><h2>Para onde foi o dinheiro</h2>${ent.length?`<div class="donut">${donut(s.by,s.o)}<div class="leg">${ent.map(([k,v])=>`<div><span><i style="background:${CATS[k][1]}"></i>${k}</span><b>${Math.round(v/s.o*100)}%</b></div>`).join('')}</div></div>`:'<div class="empty">Nenhum gasto neste mês ainda.</div>'}</div>
<div class="card"><h2>Contas a pagar <span class="mute">${pend.length} pendentes</span></h2>${pend.length?`<div class="mute" style="margin-bottom:6px">Faltam ${brl(due)} em contas fixas</div>`:'<div class="empty">Tudo pago. 🎉</div>'}${pend.slice(0,3).map(b=>`<div class="item"><div class="ic" style="background:#FFB02022">🧾</div><div class="grow"><b>${esc(b.n)}</b><small>vence dia ${b.day}</small></div><b>${brl(b.v)}</b></div>`).join('')}</div>
<div class="card"><h2>Metas <span class="mute">${S.goals.length}</span></h2>${S.goals.slice(0,3).map(g=>{const p=Math.min(100,g.sv/g.tg*100);return`<div style="margin-top:8px"><div style="display:flex;justify-content:space-between"><b>${g.e} ${esc(g.n)}</b><span class="mute">${Math.round(p)}%</span></div><div class="bar"><i style="width:${p}%;background:var(--hero)"></i></div></div>`}).join('')||'<div class="empty">Crie sua primeira meta.</div>'}</div>
<div class="card"><h2>Últimos lançamentos</h2>${mtx().slice(0,4).map(x=>txRow(x)).join('')||'<div class="empty">Toque no + para começar.</div>'}</div>`}
function gastos(){const t=mtx();return`<div class="card"><h2>Lançamentos de ${mlabel()}</h2>${t.map(x=>txRow(x,1)).join('')||'<div class="empty">Sem lançamentos. Toque no + para adicionar.</div>'}</div>`}
function orc(){const s=sums();const tb=Object.values(S.bud).reduce((a,b)=>a+b,0);return`<div class="card"><h2>Orçamento <span class="mute">${brl(s.o)} de ${brl(tb)}</span></h2>${Object.keys(CATS).map(k=>{const v=s.by[k]||0,l=S.bud[k]||0,p=l?v/l*100:0,col=p>100?'var(--r)':p>80?'var(--y)':CATS[k][1];return`<div class="item" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center"><b>${CATS[k][0]} ${k}</b><button class="btn s o" onclick="setBud('${k}')">${brl(l)}</button></div><div class="bar"><i style="width:${Math.min(100,p)}%;background:${col}"></i></div><small class="${p>100?'neg':'mute'}">${p>100?'Estourou em '+brl(v-l):'Restam '+brl(l-v)} · gasto ${brl(v)}</small></div>`}).join('')}</div>`}
function metas(){return`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><h2>Metas de economia</h2><button class="btn s" onclick="addGoal()">+ Nova meta</button></div>${S.goals.map(g=>{const p=Math.min(100,g.sv/g.tg*100),R=30,C=2*Math.PI*R;const left=g.tg-g.sv;return`<div class="card goal"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="${R}" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="38" cy="38" r="${R}" fill="none" stroke="${p>=100?'#14C38E':'#A855F7'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 38 38)"/><text x="38" y="43" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">${Math.round(p)}%</text></svg><div class="grow"><b style="white-space:normal">${g.e} ${esc(g.n)}</b><small>${brl(g.sv)} de ${brl(g.tg)}</small><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn s g" onclick="deposit('${g.id}')">Guardar</button><button class="btn s o" onclick="delGoal('${g.id}')">Excluir</button></div>${left>0?`<small class="mute">${(left/Math.max(1,sums().bal>0?sums().bal:500)).toFixed(1)} meses guardando o saldo atual</small>`:'<small class="pos">Meta conquistada! 🏆</small>'}</div></div>`}).join('')||'<div class="card empty">Sem metas. Crie uma para começar.</div>'}`}
function contas(){const doneT=S.tasks.filter(t=>t.ok[ym]).length;return`<div class="card"><h2>Contas fixas <button class="btn s" onclick="addBill()">+ Conta</button></h2>${S.bills.map(b=>`<div class="item"><button class="chk ${b.paid[ym]?'on':''}" aria-label="Marcar como paga" onclick="togBill('${b.id}')">${b.paid[ym]?'✓':''}</button><div class="grow ${b.paid[ym]?'done':''}"><b>${esc(b.n)}</b><small>vence dia ${b.day}</small></div><b>${brl(b.v)}</b><button class="x" aria-label="Excluir" onclick="delBill('${b.id}')">✕</button></div>`).join('')||'<div class="empty">Nenhuma conta cadastrada.</div>'}</div>
<div class="card"><h2>Checklist do mês <span class="mute">${doneT}/${S.tasks.length}</span></h2><div class="bar" style="margin-bottom:8px"><i style="width:${S.tasks.length?doneT/S.tasks.length*100:0}%;background:var(--g)"></i></div>${S.tasks.map(t=>`<div class="item"><button class="chk ${t.ok[ym]?'on':''}" aria-label="Concluir" onclick="togTask('${t.id}')">${t.ok[ym]?'✓':''}</button><div class="grow ${t.ok[ym]?'done':''}"><b style="white-space:normal">${esc(t.n)}</b></div><button class="x" aria-label="Excluir" onclick="delTask('${t.id}')">✕</button></div>`).join('')}<button class="btn s o" style="margin-top:10px" onclick="addTask()">+ Tarefa</button></div>
<div class="card"><h2>Dados</h2><button class="btn s o" onclick="resetAll()">Apagar tudo e começar do zero</button> <button class="btn s o" onclick="toggleTheme()">Alternar tema</button></div>`}
const TABS=[['home','🏡','Início',home],['gastos','💸','Gastos',gastos],['orc','🎯','Orçamento',orc],['metas','🐷','Metas',metas],['contas','🧾','Contas',contas]];
function render(){const t=TABS.find(x=>x[0]===tab);$('#app').innerHTML=`<div class="top"><h1>Meu Mês</h1><div class="mn"><button aria-label="Mês anterior" onclick="shift(-1)">‹</button><span>${mlabel()}</span><button aria-label="Próximo mês" onclick="shift(1)">›</button></div></div>`+t[3]();
$('#nav').innerHTML=TABS.map(x=>`<button class="${x[0]===tab?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');
$('#fab').style.display=(tab==='metas'||tab==='contas'||tab==='orc')?'none':'block';save()}
function $(s){return document.querySelector(s)}
function go(t){tab=t;window.scrollTo(0,0);render()}
function sheet(title,html,ok){const d=document.createElement('div');d.className='sheet';d.innerHTML=`<form><h2>${title}</h2>${html}<div style="display:flex;gap:8px"><button type="button" class="btn o" style="flex:1" id="cx">Cancelar</button><button class="btn" style="flex:2">Salvar</button></div></form>`;document.body.appendChild(d);const f=d.querySelector('form');d.onclick=e=>{if(e.target===d)d.remove()};d.querySelector('#cx').onclick=()=>d.remove();f.onsubmit=e=>{e.preventDefault();ok(Object.fromEntries(new FormData(f)));d.remove();render()};const i=f.querySelector('input');i&&i.focus();return f}
function addTx(){let type='out';const opts=()=>(type==='out'?Object.keys(CATS):INC).map(c=>`<option>${c}</option>`).join('');
const f=sheet('Novo lançamento',`<div class="seg"><button type="button" class="on out" data-t="out">Gasto</button><button type="button" data-t="in">Receita</button></div><input name="d" placeholder="Descrição (ex.: Mercado)" required><input name="v" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="Valor (R$)" required><select name="c">${opts()}</select><input name="dt" type="date" value="${new Date().toISOString().slice(0,7)===ym?new Date().toISOString().slice(0,10):mk(1)}" required>`,
o=>S.tx.push({id:uid(),t:type,d:o.d,v:+o.v,c:o.c,dt:o.dt}));
f.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{type=b.dataset.t;f.querySelectorAll('.seg button').forEach(x=>x.className='');b.className='on '+type;f.c.innerHTML=opts()})}
function delTx(id){S.tx=S.tx.filter(x=>x.id!==id);render()}
function setBud(k){sheet('Limite de '+k,`<input name="v" type="number" min="0" inputmode="decimal" value="${S.bud[k]||0}" required>`,o=>S.bud[k]=+o.v)}
function addGoal(){sheet('Nova meta',`<input name="e" placeholder="Emoji (ex.: 🚗)" maxlength="2"><input name="n" placeholder="Nome da meta" required><input name="tg" type="number" min="1" inputmode="decimal" placeholder="Valor alvo (R$)" required>`,o=>S.goals.push({id:uid(),n:o.n,e:o.e||'🎯',tg:+o.tg,sv:0}))}
function deposit(id){const g=S.goals.find(x=>x.id===id);sheet('Guardar em '+g.n,`<input name="v" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Quanto você vai guardar? (R$)" required>`,o=>{g.sv+=+o.v;S.tx.push({id:uid(),t:'out',d:'Meta: '+g.n,v:+o.v,c:'Outros',dt:new Date().toISOString().slice(0,7)===ym?new Date().toISOString().slice(0,10):mk(1)})})}
function delGoal(id){S.goals=S.goals.filter(x=>x.id!==id);render()}
function addBill(){sheet('Nova conta fixa',`<input name="n" placeholder="Nome (ex.: Internet)" required><input name="v" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Valor (R$)" required><input name="day" type="number" min="1" max="31" placeholder="Dia do vencimento" required>`,o=>S.bills.push({id:uid(),n:o.n,v:+o.v,day:+o.day,paid:{}}))}
function togBill(id){const b=S.bills.find(x=>x.id===id);b.paid[ym]=!b.paid[ym];render()}
function delBill(id){S.bills=S.bills.filter(x=>x.id!==id);render()}
function addTask(){sheet('Nova tarefa',`<input name="n" placeholder="O que fazer neste mês?" required>`,o=>S.tasks.push({id:uid(),n:o.n,ok:{}}))}
function togTask(id){const t=S.tasks.find(x=>x.id===id);t.ok[ym]=!t.ok[ym];render()}
function delTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);render()}
function resetAll(){if(confirm('Apagar todos os dados?')){S={tx:[],bud:Object.fromEntries(Object.keys(CATS).map(k=>[k,0])),goals:[],bills:[],tasks:[]};render()}}
function toggleTheme(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'}
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
